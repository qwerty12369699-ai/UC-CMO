<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UC Calendar - Reservation Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/utils/navbar.css?v=2">
  <link rel="stylesheet" href="/utils/footer.css">
  <style>
    .calendar-header-section {
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #388e3c 100%);
      color: white;
      border-radius: var(--radius-lg);
      padding: var(--spacing-2xl) var(--spacing-xl);
      margin-bottom: var(--spacing-xl);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .calendar-header-section::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .calendar-header-section h1 {
      font-size: var(--font-size-3xl);
      margin: 0 0 var(--spacing-sm);
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .calendar-header-section p {
      color: rgba(255, 255, 255, 0.85);
      font-size: var(--font-size-base);
      margin: 0;
      position: relative;
      z-index: 1;
    }

    .main-content {
      display: none;
    }
    .main-content.show {
      display: block;
    }

    .calendar-legend {
      text-align: center;
      margin: var(--spacing-lg) auto;
      display: flex;
      justify-content: center;
      gap: var(--spacing-xl);
      flex-wrap: wrap;
    }

    .legend-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }

    .today { background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%); }
    .reserved { background: linear-gradient(135deg, #ff7043 0%, #ff5722 100%); }
    .pending { background: linear-gradient(135deg, #ffb74d 0%, #ff9800 100%); }
    .available { background-color: white; border: 1px solid var(--gray-300); }

    .calendar-container-card {
      background: white;
      border-radius: var(--radius-md);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(46, 125, 50, 0.1);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-lg);
    }

    .calendar-header h2 {
      color: var(--green-900);
      font-size: var(--font-size-2xl);
      font-weight: 700;
      margin: 0;
    }

    .calendar-controls {
      display: flex;
      gap: var(--spacing-sm);
    }

    .nav-btn {
      background: var(--green-700);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition-fast);
      font-size: var(--font-size-base);
    }

    .nav-btn:hover {
      background: var(--green-800);
    }

    .venue-filter-container {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
      padding: var(--spacing-md);
      background: var(--gray-100);
      border-radius: var(--radius-sm);
    }

    .venue-filter-container label {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-weight: 600;
      color: var(--gray-800);
      white-space: nowrap;
      font-size: var(--font-size-sm);
    }

    .venue-filter-container label i {
      color: var(--green-700);
    }

    .venue-filter-select {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      background: white;
      cursor: pointer;
      font-family: var(--font-family);
    }

    .venue-filter-select:focus {
      outline: none;
      border-color: var(--green-600);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      border: 1px solid var(--gray-200);
      border-bottom: none;
      border-right: none;
    }

    .day-name {
      background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
      color: white;
      text-align: center;
      padding: 12px;
      font-weight: 600;
      font-size: var(--font-size-sm);
      border-bottom: 1px solid #1b5e20;
      border-right: 1px solid #1b5e20;
    }

    .calendar-day {
      background: white;
      text-align: center;
      padding: 6px;
      cursor: pointer;
      transition: all var(--transition-fast);
      min-height: 105px;
      max-height: 105px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      position: relative;
      font-weight: 600;
      color: var(--gray-800);
      border-bottom: 1px solid var(--gray-200);
      border-right: 1px solid var(--gray-200);
    }

    .calendar-day.today {
      background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
      color: white;
    }

    .calendar-day.today .day-number {
      background: rgba(255, 255, 255, 0.3);
    }

    .calendar-day.reserved {
      background: linear-gradient(135deg, #ff7043 0%, #ff5722 100%);
      color: white;
      box-shadow: inset 0 2px 4px rgba(255, 87, 34, 0.2);
    }

    .calendar-day.pending {
      background: linear-gradient(135deg, #ffb74d 0%, #ff9800 100%);
      color: white;
      box-shadow: inset 0 2px 4px rgba(255, 152, 0, 0.2);
    }

    .calendar-day.empty {
      background: none;
      border-bottom: 1px solid var(--gray-200);
      border-right: 1px solid var(--gray-200);
      cursor: default;
    }

    .day-number {
      font-size: var(--font-size-xs);
      font-weight: 700;
      position: absolute;
      top: 4px;
      right: 6px;
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 22px;
      text-align: center;
    }

    .event-title {
      font-size: 0.6rem;
      font-weight: 600;
      line-height: 1.1;
      margin-top: 28px;
      margin-bottom: 2px;
      text-align: left;
      word-wrap: break-word;
      flex: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      max-height: 2rem;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      padding: 0 4px;
    }

    .event-location {
      font-size: 0.5rem;
      opacity: 0.9;
      line-height: 1;
      text-align: left;
      word-wrap: break-word;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 4px;
      border-radius: 2px;
      font-weight: 500;
      max-height: 1rem;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      width: 100%;
      padding: 2px 4px;
    }

    .admin-header-card {
      display: none;
    }

    @media (max-width: 768px) {
      .calendar-header-section {
        padding: var(--spacing-lg) var(--spacing-md);
      }
      .calendar-header-section h1 {
        font-size: var(--font-size-2xl);
      }
      .calendar-grid {
        grid-template-columns: repeat(7, 1fr);
      }
      .calendar-day {
        min-height: 85px;
        max-height: 85px;
        padding: 4px;
      }
      .day-number {
        font-size: 0.65rem;
        top: 2px;
        right: 3px;
      }
      .event-title {
        font-size: 0.5rem;
        margin-top: 22px;
        max-height: 1.5rem;
      }
      .event-location {
        font-size: 0.45rem;
      }
      .calendar-container-card {
        padding: var(--spacing-md);
      }
      .calendar-legend {
        gap: var(--spacing-md);
        font-size: var(--font-size-sm);
      }
    }
  </style>
</head>
<body>

  <div id="auth-error" class="auth-error-overlay">
    <div class="overlay-box">
      <i class="fas fa-exclamation-triangle" style="font-size: 2rem; color: var(--danger); margin-bottom: var(--spacing-md);"></i>
      <h3>Authentication Required</h3>
      <p>You need to be logged in as an admin to access this page.</p>
      <button class="btn btn-primary" onclick="window.location.href='/login'">Go to Login</button>
    </div>
  </div>

  <div class="main-content">
    <div id="navbar-container"></div>

    <div class="container">
      <div class="calendar-header-section">
      <h1><i class="fas fa-calendar-alt"></i> Reservation Calendar</h1>
      <p>Review and filter campus booking dates from the admin calendar</p>
    </div>

    <!-- Legend -->
    <div class="calendar-legend">
      <div><span class="legend-circle today"></span> Today</div>
      <div><span class="legend-circle reserved"></span> Approved Reservations</div>
      <div><span class="legend-circle pending"></span> Pending Requests</div>
      <div><span class="legend-circle available"></span> Available Dates</div>
    </div>

    <!-- Calendar -->
    <div class="calendar-container-card">
      <div class="calendar-header">
        <h2 id="monthYear"></h2>
        <div class="calendar-controls">
          <button id="prevMonth" class="nav-btn">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button id="nextMonth" class="nav-btn">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <!-- Venue Filter -->
      <div class="venue-filter-container">
        <label for="admin-venue-filter">
          <i class="fas fa-filter"></i>
          Filter by Venue:
        </label>
        <select id="admin-venue-filter" class="venue-filter-select">
          <option value="">All Venues</option>
          <!-- Main Campus -->
          <option value="Auditorium">Auditorium</option>
          <option value="Cañao Hall">Cañao Hall</option>
          <option value="Conference Room">Conference Room</option>
          <option value="Gymnasium">Gymnasium</option>
          <option value="Laboratory Room">Laboratory Room</option>
          <option value="Lecture Room (Main)">Lecture Room (Main)</option>
          <option value="Training Center">Training Center</option>
          <!-- Legarda -->
          <option value="AVR">AVR</option>
          <option value="Crime Lab">Crime Lab</option>
          <option value="Deftac">Deftac</option>
          <option value="Lecture Room (Legarda)">Lecture Room (Legarda)</option>
          <option value="Moot Court">Moot Court</option>
        </select>
      </div>

      <div class="calendar-grid" id="calendar">
        <div class="day-name">Sun</div>
        <div class="day-name">Mon</div>
        <div class="day-name">Tue</div>
        <div class="day-name">Wed</div>
        <div class="day-name">Thu</div>
        <div class="day-name">Fri</div>
        <div class="day-name">Sat</div>
      </div>
    </div>

    <!-- Modal -->
    <div id="eventModal" class="modal" onclick="closeModal(event)">
      <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        <i class="fas fa-calendar-check" style="font-size: 2rem; color: var(--green-700); margin-bottom: var(--spacing-md);"></i>
        <h3 id="modalTitle" style="color: var(--green-900); margin-bottom: var(--spacing-md);">Event Title</h3>
        <p style="margin-bottom: 8px;"><i class="fas fa-clock" style="color: var(--green-600); width: 20px;"></i> <strong>Time:</strong> <span id="modalTime"></span></p>
        <p style="margin-bottom: 8px;"><i class="fas fa-map-marker-alt" style="color: var(--green-600); width: 20px;"></i> <strong>Location:</strong> <span id="modalLocation"></span></p>
        <div class="additional-info" id="additionalInfo"></div>
      </div>
    </div>
  </div>

  <style>
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background-color: white;
      padding: var(--spacing-xl);
      border-radius: var(--radius-md);
      width: 90%;
      max-width: 420px;
      text-align: left;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-content h3 {
      font-size: var(--font-size-xl);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      color: var(--gray-500);
      cursor: pointer;
      background: none;
      border: none;
      padding: 5px;
      line-height: 1;
      transition: color var(--transition-fast);
    }

    .close-btn:hover {
      color: var(--gray-800);
    }

    .additional-info {
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--gray-200);
    }

    .additional-info p {
      margin: 8px 0;
    }

    .status-pending {
      color: var(--warning);
      font-weight: bold;
      text-transform: capitalize;
      background: var(--warning-bg);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .status-approved {
      color: var(--success);
      font-weight: bold;
      text-transform: capitalize;
      background: var(--success-bg);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .status-rejected {
      color: var(--danger);
      font-weight: bold;
      text-transform: capitalize;
      background: var(--danger-bg);
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>

  <script>
    let reservedEvents = {};
    let calendarData = {};
    let allCalendarData = {};
    let currentVenueFilter = '';
    let currentDate = new Date();

    async function loadCalendarData() {
      try {
        const token = localStorage.getItem('token');
        const response = await fetch('/api/reservations/admin/calendar', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          allCalendarData = data.calendarData || {};
          calendarData = { ...allCalendarData };
          updateReservedEvents();
          renderCalendar();
        }
      } catch (error) {
        console.error('Error loading calendar data:', error);
        loadMockData();
      }
    }

    function loadMockData() {
      reservedEvents = {
        "2025-06-15": { title: "Faculty Meeting", time: "10:00 AM – 12:00 PM", location: "AVR Room", status: "confirmed", user: "Admin", type: "event" },
        "2025-06-20": { title: "Student Orientation", time: "1:00 PM – 4:00 PM", location: "Auditorium", status: "confirmed", user: "Admin", type: "event" },
        "2025-06-23": { title: "Defense Presentation", time: "9:00 AM – 11:00 AM", location: "Lecture Room 101", status: "pending", user: "John Doe", type: "internal" }
      };
      renderCalendar();
    }

    function renderCalendar() {
      const calendar = document.getElementById("calendar");
      const monthYear = document.getElementById("monthYear");

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const todayStr = new Date().toISOString().split("T")[0];

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      monthYear.textContent = `${monthNames[month]} ${year}`;

      const dayHeaders = calendar.querySelectorAll('.day-name');
      calendar.innerHTML = '';
      dayHeaders.forEach(header => calendar.appendChild(header));

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.classList.add("calendar-day", "empty");
        calendar.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const cell = document.createElement("div");
        cell.classList.add("calendar-day");
        cell.textContent = d;

        if (dateStr === todayStr) {
          cell.classList.add("today");
        }

        if (reservedEvents[dateStr]) {
          const event = reservedEvents[dateStr];

          if (event.status === 'pending') {
            cell.classList.add("pending");
          } else {
            cell.classList.add("reserved");
          }

          const dayNumber = document.createElement('div');
          dayNumber.className = 'day-number';
          dayNumber.textContent = d;

          const eventTitle = document.createElement('div');
          eventTitle.className = 'event-title';
          eventTitle.textContent = truncateText(event.title, 20);
          eventTitle.title = event.title;

          const eventLocation = document.createElement('div');
          eventLocation.className = 'event-location';
          eventLocation.textContent = truncateText(event.location || 'TBD', 25);
          eventLocation.title = event.location || 'TBD';

          cell.textContent = '';
          cell.appendChild(dayNumber);
          cell.appendChild(eventTitle);
          cell.appendChild(eventLocation);

          cell.onclick = () => showModal(dateStr);
          cell.style.cursor = 'pointer';
        }

        calendar.appendChild(cell);
      }
    }

    function truncateText(text, maxLength) {
      if (!text) return '';
      if (text.length <= maxLength) return text;
      return text.substring(0, maxLength - 3) + '...';
    }

    function showModal(date) {
      const event = reservedEvents[date];
      document.getElementById("modalTitle").textContent = event.title;
      document.getElementById("modalTime").textContent = event.time || 'Not specified';
      document.getElementById("modalLocation").textContent = event.location || 'TBD';

      const additionalInfo = document.getElementById('additionalInfo');

      if (event.user && event.type) {
        additionalInfo.innerHTML = `
          <p><strong>Requested by:</strong> ${event.user}</p>
          <p><strong>Type:</strong> ${event.type.charAt(0).toUpperCase() + event.type.slice(1)}</p>
          <p><strong>Status:</strong> <span class="status-${event.status}">${event.status.charAt(0).toUpperCase() + event.status.slice(1)}</span></p>
        `;
        additionalInfo.style.display = 'block';
      } else {
        additionalInfo.style.display = 'none';
      }

      document.getElementById("eventModal").style.display = "flex";
    }

    function closeModal(event) {
      if (event && event.target !== event.currentTarget) {
        return;
      }
      document.getElementById("eventModal").style.display = "none";
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeModal();
      }
    });

    function updateReservedEvents() {
      reservedEvents = {};
      Object.keys(calendarData).forEach(date => {
        if (calendarData[date].length > 0) {
          const firstEvent = calendarData[date][0];
          reservedEvents[date] = {
            title: firstEvent.title,
            time: firstEvent.time,
            location: firstEvent.location,
            venue: firstEvent.venue,
            status: firstEvent.status,
            user: firstEvent.user,
            type: firstEvent.type
          };
        }
      });
    }

    function applyVenueFilter() {
      if (currentVenueFilter === '') {
        calendarData = { ...allCalendarData };
      } else {
        calendarData = {};
        Object.keys(allCalendarData).forEach(date => {
          const filteredEvents = allCalendarData[date].filter(event =>
            event.venue === currentVenueFilter || event.location === currentVenueFilter
          );
          if (filteredEvents.length > 0) {
            calendarData[date] = filteredEvents;
          }
        });
      }
      updateReservedEvents();
      renderCalendar();
    }

    function initializeControls() {
      document.getElementById('prevMonth').addEventListener('click', function() {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
      });

      document.getElementById('nextMonth').addEventListener('click', function() {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
      });

      document.getElementById('admin-venue-filter').addEventListener('change', function() {
        currentVenueFilter = this.value;
        applyVenueFilter();
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadCalendarData();
      initializeControls();
    });

    renderCalendar();

    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (!token) {
        document.getElementById('auth-error').style.display = 'flex';
        return;
      }

      fetch('/api/auth/admin/verify', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      })
      .then(response => {
        if (!response.ok) throw new Error('Auth failed');
        return response.json();
      })
      .then(data => {
        initializeNavbar('admin', 'calendar', data.user.role);
        const mainContent = document.querySelector('.main-content');
        if (mainContent) {
          mainContent.classList.add('show');
        }
        const authOverlay = document.getElementById('auth-error');
        if (authOverlay) {
          authOverlay.style.display = 'none';
        }
      })
      .catch(() => {
        const authOverlay = document.getElementById('auth-error');
        if (authOverlay) {
          authOverlay.style.display = 'flex';
        }
        localStorage.removeItem('token');
      });
    });
  </script>
    <script src="/js/roleUtils.js"></script>
    <script src="/utils/navbar.js"></script>
    <script src="/utils/footer.js"></script>
</body>
</html>
