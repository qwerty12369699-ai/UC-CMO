<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC Campus - Events Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/utils/navbar.css?v=2">
    <link rel="stylesheet" href="/utils/modals.css">
    <link rel="stylesheet" href="/utils/footer.css">
    <style>
        .main-content {
            display: none;
        }
        .main-content.show {
            display: block;
        }

        .events-header {
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #388e3c 100%);
            color: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl) var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .events-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }

        .events-header h1 {
            font-size: var(--font-size-3xl);
            margin: 0 0 var(--spacing-sm);
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .events-header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: var(--font-size-base);
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .form-card {
            background: white;
            border-radius: var(--radius-md);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(46, 125, 50, 0.1);
            margin-bottom: var(--spacing-xl);
        }

        .form-card h2 {
            color: var(--green-900);
            font-size: var(--font-size-xl);
            margin: 0 0 var(--spacing-lg);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .form-card h2 i {
            color: var(--green-700);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--green-800) 0%, var(--green-900) 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-base);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.35);
        }

        .submit-btn:disabled {
            background: var(--gray-300);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .events-list-card {
            background: white;
            border-radius: var(--radius-md);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(46, 125, 50, 0.1);
        }

        .events-list-card h2 {
            color: var(--green-900);
            font-size: var(--font-size-xl);
            margin: 0 0 var(--spacing-lg);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .events-list-card h2 i {
            color: var(--green-700);
        }

        .no-events {
            text-align: center;
            color: var(--gray-500);
            font-style: italic;
            padding: var(--spacing-2xl);
        }

        .no-events img {
            width: 120px;
            opacity: 0.5;
            margin-bottom: var(--spacing-md);
        }

        .admin-header-card {
            display: none;
        }

        @media (max-width: 768px) {
            .events-header {
                padding: var(--spacing-lg) var(--spacing-md);
            }
            .events-header h1 {
                font-size: var(--font-size-2xl);
            }
        }
    </style>
</head>
<body>
    <div id="auth-error" class="auth-error-overlay">
        <div class="overlay-box">
            <i class="fas fa-exclamation-triangle" style="font-size: 2rem; color: var(--danger); margin-bottom: var(--spacing-md);"></i>
            <h3>Authentication Required</h3>
            <p>You need to be logged in as an admin to access this page.</p>
            <button class="btn btn-primary" onclick="window.location.href='/login'">Go to Login</button>
        </div>
    </div>

    <div class="main-content">
        <div id="navbar-container"></div>
        
        <div class="container">
            <div class="events-header">
                <h1><i class="fas fa-calendar-alt"></i> Events Management</h1>
                <p>Create and manage upcoming events for the UC Campus</p>
            </div>

            <div id="alert" class="alert"></div>

            <div class="form-card">
                <h2><i class="fas fa-plus-circle"></i> Add New Event</h2>
                <form id="eventForm">
                    <div class="form-group">
                        <label for="title">Event Title *</label>
                        <input type="text" id="title" name="title" class="form-control" required maxlength="100" placeholder="Enter event title">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Date *</label>
                            <input type="date" id="date" name="date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="time">Time *</label>
                            <input type="text" id="time" name="time" class="form-control" placeholder="e.g., 8:00 AM - 12:00 PM" required maxlength="50">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="location">Location *</label>
                        <input type="text" id="location" name="location" class="form-control" placeholder="e.g., Function Hall, Main Campus" required maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="event_image">Event Image (Optional)</label>
                        <input type="file" id="event_image" name="event_image" class="form-control" accept="image/*">
                        <span class="form-hint">Upload an image for this event (JPG, PNG, GIF)</span>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        <i class="fas fa-plus"></i> Create Event
                    </button>
                </form>
            </div>

            <div class="events-list-card">
                <h2><i class="fas fa-list"></i> Upcoming Events</h2>
                <div id="eventsList">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Loading events...</p>
                    </div>
                </div>
                <div class="pagination" id="eventsPagination" style="display: none;">
                    <button class="btn btn-primary btn-sm" id="prevEventsBtn"><i class="fas fa-chevron-left"></i> Previous</button>
                    <span id="eventsPageInfo" class="page-info">Page 1 of 1</span>
                    <button class="btn btn-primary btn-sm" id="nextEventsBtn">Next <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allEvents = [];
        let currentEventsPage = 1;
        const eventsPerPage = 3;

        function getToken() {
            return localStorage.getItem('token');
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        async function loadEvents() {
            try {
                const response = await fetch('/api/events');
                if (response.ok) {
                    allEvents = await response.json();
                    currentEventsPage = 1;
                    displayEvents();
                } else {
                    const errorData = await response.json();
                    console.error('Failed to load events:', errorData);
                    throw new Error(errorData.message || 'Failed to load events');
                }
            } catch (error) {
                console.error('Error loading events:', error);
                allEvents = [];
                document.getElementById('eventsList').innerHTML = `<div class="no-events">
                    <img src="/images/NoEventsShowcase.png" alt="No Events" />
                    <p>Error loading events: ${error.message}</p>
                </div>`;
                document.getElementById('eventsPagination').style.display = 'none';
            }
        }

        function displayEvents() {
            const container = document.getElementById('eventsList');
            const pagination = document.getElementById('eventsPagination');

            if (allEvents.length === 0) {
                container.innerHTML = `<div class="no-events">
                    <img src="/images/NoEventsShowcase.png" alt="No Events" />
                    <p>No upcoming events</p>
                </div>`;
                pagination.style.display = 'none';
                return;
            }

            const startIndex = (currentEventsPage - 1) * eventsPerPage;
            const endIndex = startIndex + eventsPerPage;
            const currentEvents = allEvents.slice(startIndex, endIndex);

            container.innerHTML = currentEvents.map(event => `
                <div class="event-item">
                    <div class="event-header">
                        <div class="event-title">${event.title}</div>
                        <button class="btn btn-danger btn-sm" onclick="deleteEvent(${event.id})" title="Delete Event">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div class="event-details">
                        <div class="event-detail">
                            <i class="fas fa-calendar"></i>
                            <span>${formatDate(event.date)}</span>
                        </div>
                        <div class="event-detail">
                            <i class="fas fa-clock"></i>
                            <span>${event.time}</span>
                        </div>
                        <div class="event-detail">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${event.location}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            updateEventsPagination();
        }

        function updateEventsPagination() {
            const totalPages = Math.ceil(allEvents.length / eventsPerPage);
            const prevBtn = document.getElementById('prevEventsBtn');
            const nextBtn = document.getElementById('nextEventsBtn');
            const pageInfo = document.getElementById('eventsPageInfo');
            const pagination = document.getElementById('eventsPagination');

            if (totalPages > 1) {
                pagination.style.display = 'flex';
                prevBtn.disabled = currentEventsPage === 1;
                nextBtn.disabled = currentEventsPage === totalPages;
                pageInfo.textContent = `Page ${currentEventsPage} of ${totalPages}`;
            } else {
                pagination.style.display = 'none';
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: '2-digit'
            });
        }

        async function deleteEvent(eventId) {
            const confirmed = await showConfirmationModal({
                title: 'Delete Event',
                message: 'Are you sure you want to delete this event? This action cannot be undone.',
                confirmText: 'Delete',
                cancelText: 'Cancel',
                type: 'danger'
            });

            if (!confirmed) {
                return;
            }

            try {
                const token = getToken();
                const response = await fetch(`/api/events/${eventId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (response.ok) {
                    await showSuccessModal({
                        title: 'Event Deleted!',
                        message: 'The event has been successfully deleted.',
                        autoClose: 3000
                    });

                    const totalPages = Math.ceil((allEvents.length - 1) / eventsPerPage);
                    if (currentEventsPage > totalPages && totalPages > 0) {
                        currentEventsPage = totalPages;
                    }

                    loadEvents();
                } else {
                    showErrorModal({
                        title: 'Delete Failed',
                        message: result.message || 'Could not delete the event. Please try again.'
                    });
                }
            } catch (error) {
                showErrorModal({
                    title: 'Network Error',
                    message: 'Could not connect to the server. Please check your connection and try again.'
                });
            }
        }

        document.getElementById('eventForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

            const formData = new FormData(this);

            try {
                const token = getToken();

                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    await showSuccessModal({
                        title: 'Event Created!',
                        message: 'Your event has been successfully created and will appear on the home page.',
                        autoClose: 4000
                    });
                    this.reset();
                    loadEvents();
                } else {
                    showErrorModal({
                        title: 'Creation Failed',
                        message: result.message || 'Could not create the event. Please check your input and try again.'
                    });
                }
            } catch (error) {
                showErrorModal({
                    title: 'Network Error',
                    message: `Could not create event: ${error.message}. Please check your connection and try again.`
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-plus"></i> Create Event';
            }
        });

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const token = getToken();

                if (!token) {
                    throw new Error('No authentication token found');
                }

                const response = await fetch('/api/auth/admin/verify', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Authentication failed');
                }

                const data = await response.json();

                initializeNavbar('admin', 'events', data.user.role);
                
                const mainContent = document.querySelector('.main-content');
                if (mainContent) {
                    mainContent.classList.add('show');
                }
                const authError = document.getElementById('auth-error');
                if (authError) {
                    authError.style.display = 'none';
                }

                loadEvents();

            } catch (error) {
                const authError = document.getElementById('auth-error');
                if (authError) {
                    authError.style.display = 'flex';
                }
                if (error.message && error.message.toLowerCase().includes('token')) {
                    localStorage.removeItem('token');
                }
            }
        });

        document.getElementById('date').min = new Date().toISOString().split('T')[0];

        document.getElementById('prevEventsBtn').addEventListener('click', () => {
            if (currentEventsPage > 1) {
                currentEventsPage--;
                displayEvents();
            }
        });

        document.getElementById('nextEventsBtn').addEventListener('click', () => {
            const totalPages = Math.ceil(allEvents.length / eventsPerPage);
            if (currentEventsPage < totalPages) {
                currentEventsPage++;
                displayEvents();
            }
        });
    </script>
    <script src="/utils/modals.js"></script>
    <script src="/utils/navbar.js"></script>
    <script src="/utils/footer.js"></script>
</body>
</html>
